name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Without this, rapid successive pushes to the same branch can run their
# deploy-staging/deploy-production jobs concurrently, and whichever finishes its
# `wrangler deploy` last wins — silently overwriting a newer commit's deploy with an
# older one's, even though both runs report success. One in-flight deploy per branch;
# a newer push cancels the older one since only the latest commit's deploy matters.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: secret-scan
    runs-on: ubuntu-latest
    environment: staging
    # Job-level so every step gets it — `opennextjs-cloudflare build` re-runs
    # `next build` internally as a separate process, so a step-scoped `env:`
    # on just the first `npm run build` step never reached that second,
    # actually-deployed build. Silently embedded undefined for
    # NEXT_PUBLIC_SUPABASE_ANON_KEY since this workflow was written.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: secret-scan
    runs-on: ubuntu-latest
    environment: production
    # See deploy-staging above: job-level so both the `npm run build` step and
    # opennextjs-cloudflare's internal second `next build` both see these.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
