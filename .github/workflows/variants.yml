name: Photo Variants

# Resizes uploaded gallery photos into 3600/2048/1024/640 JPEGs (Phase 5.2).
# Runs here rather than in the Worker so resizing never burns Worker CPU.
# Like backup.yml, the schedule and the manual button only work once this file
# is on the default branch (main).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Two overlapping runs would resize the same photos twice.
concurrency:
  group: photo-variants
  cancel-in-progress: false

jobs:
  variants:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      # Staging-only until Phase 9: always run develop's code against the
      # staging environment's secrets, even though the schedule fires from main.
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run variants
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Media-bucket credentials, separate from the backups token
          # (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY repo secrets).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_MEDIA_BUCKET }}
